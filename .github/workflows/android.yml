name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      # PR builds use Android's temporary debug signing key and publish a
      # test-only APK artifact. Builds on main use the persistent signing key.
      - name: Configure persistent APK signing
        if: github.event_name != 'pull_request'
        env:
          TURBOFETCH_DEBUG_KEYSTORE_BASE64: ${{ secrets.TURBOFETCH_DEBUG_KEYSTORE_BASE64 }}
          TURBOFETCH_DEBUG_STORE_PASSWORD: ${{ secrets.TURBOFETCH_DEBUG_STORE_PASSWORD }}
          TURBOFETCH_DEBUG_KEY_ALIAS: ${{ secrets.TURBOFETCH_DEBUG_KEY_ALIAS }}
          TURBOFETCH_DEBUG_KEY_PASSWORD: ${{ secrets.TURBOFETCH_DEBUG_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TURBOFETCH_DEBUG_KEYSTORE_BASE64:-}" ||
                -z "${TURBOFETCH_DEBUG_STORE_PASSWORD:-}" ||
                -z "${TURBOFETCH_DEBUG_KEY_ALIAS:-}" ||
                -z "${TURBOFETCH_DEBUG_KEY_PASSWORD:-}" ]]; then
            echo "::error::Persistent APK signing secrets are not configured. See docs/CI_DEBUG_SIGNING.md."
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/turbofetch-debug.keystore"
          printf '%s' "$TURBOFETCH_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          echo "TURBOFETCH_DEBUG_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "TURBOFETCH_DEBUG_STORE_PASSWORD=$TURBOFETCH_DEBUG_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "TURBOFETCH_DEBUG_KEY_ALIAS=$TURBOFETCH_DEBUG_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "TURBOFETCH_DEBUG_KEY_PASSWORD=$TURBOFETCH_DEBUG_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signers
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          mapfile -t apks < <(find app/build/outputs/apk/debug -type f -name '*.apk' | sort)
          test "${#apks[@]}" -ge 4
          for apk in "${apks[@]}"; do
            echo "Verifying $apk"
            "$apksigner" verify --verbose --print-certs "$apk"
          done

      - name: Upload arm64 APK
        if: always() && success()
        uses: actions/upload-artifact@v4
        with:
          name: TurboFetch-arm64-v8a-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload armeabi-v7a APK
        if: always() && success()
        uses: actions/upload-artifact@v4
        with:
          name: TurboFetch-armeabi-v7a-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 APK
        if: always() && success()
        uses: actions/upload-artifact@v4
        with:
          name: TurboFetch-x86_64-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*x86_64*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86 APK
        if: always() && success()
        uses: actions/upload-artifact@v4
        with:
          name: TurboFetch-x86-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*x86*.apk
          if-no-files-found: error
          retention-days: 14
